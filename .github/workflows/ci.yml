name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cold_race_build:
        description: Build the race-enabled k6 binary with an empty Go build cache
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
          cache: true
      - run: make verify
  runtime:
    name: runtime (${{ matrix.go }}, k6 ${{ matrix.k6 }}, ${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - go: '1.27.4'
            k6: 'v2.4.0'
            platform: linux-amd64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: make compatibility
        env:
          COMPAT_GO: ${{ matrix.go }}
          COMPAT_K6: ${{ matrix.k6 }}
  k6-race:
    name: k6-race
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Build race-enabled k6
        shell: bash
        env:
          COLD_RACE_BUILD: ${{ inputs.cold_race_build }}
        run: |
          if [[ "$COLD_RACE_BUILD" == true ]]; then
            GOCACHE=$(mktemp -d "$RUNNER_TEMP/k6-race-cache.XXXXXX")
            export GOCACHE
            echo "Using an empty Go build cache"
          fi
          TIMEFORMAT='Race build wall time: %3R s'
          time make build-k6-race
      - name: Run signed loopback race workload
        shell: bash
        run: |
          TIMEFORMAT='Race test wall time: %3R s'
          time make test-e2e-race
  vulnerabilities:
    name: vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
          cache: true
      - run: make vuln

  interop:
    name: interop
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        timeout-minutes: 2
        with:
          go-version-file: .go-version
          cache: true
      - name: Build custom k6
        run: make build-k6
        timeout-minutes: 5
      - name: Provision WSS4J and run independent assertions
        run: make test-interop

  required-ci:
    name: required-ci
    needs: [quality, runtime, k6-race, interop, vulnerabilities]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every CI job to succeed
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          K6_RACE_RESULT: ${{ needs.k6-race.result }}
          INTEROP_RESULT: ${{ needs.interop.result }}
          VULNERABILITIES_RESULT: ${{ needs.vulnerabilities.result }}
        run: |
          failed=0
          for result in "quality=$QUALITY_RESULT" "runtime=$RUNTIME_RESULT" \
            "k6-race=$K6_RACE_RESULT" "interop=$INTEROP_RESULT" "vulnerabilities=$VULNERABILITIES_RESULT"; do
            echo "$result"
            if [[ "${result#*=}" != success ]]; then
              failed=1
            fi
          done
          if [[ "$failed" == 1 ]]; then
            echo 'Required jobs did not succeed'
            exit 1
          fi
          echo 'All required jobs succeeded'
