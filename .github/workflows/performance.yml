name: Performance regression
on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: performance
  cancel-in-progress: false
jobs:
  compare:
    # Only trusted main may execute on the dedicated host. The opt-in keeps
    # this job from queuing on repositories without that host.
    if: github.ref == 'refs/heads/main' && vars.XK6_PERF_RUNNER_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, xk6-perf-i7-12800h]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
          cache: false
      - run: make bench
