name: Release dry run
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release-dry-run.yml'
      - '.go-version'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'RELEASE_NOTES.md'
      - 'docs/release.md'
      - 'scripts/release*'
      - 'test/release/**'
permissions:
  contents: read
jobs:
  rehearse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - run: make release-dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: release-dry-run-report
          path: |
            bin/release-dry-run/metadata.json
            bin/release-dry-run/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
